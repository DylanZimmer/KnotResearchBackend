services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SAGE_MATH_URL: http://sage-math:8000
    ports:
      - "8080:8080"
    depends_on:
      sage-math:
        condition: service_healthy

  sage-math:
    build:
      context: ./sage-math-service
    ports:
      - "8000:8000"
    volumes:
      - ./sage-math-service/app:/app/app
    healthcheck:
      test: ["CMD", "sage", "-python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # KnotResearch AI (../AI_Service): turns written questions into experiments (POST /plan).
  # It only reads from the backend (the knot list); it never starts experiments.
  ai-service:
    build:
      context: ../AI_Service
    # HF_TOKEN / HF_MODEL come from AI_Service/.env at run time, so the token is never in the image.
    env_file:
      - path: ../AI_Service/.env
        required: false
    environment:
      # The backend container by default; dev.ps1 points it at the backend running on this machine.
      BACKEND_URL: ${AI_BACKEND_URL:-http://backend:8080}
    ports:
      # 8000 inside the container; 8001 on this machine, since SageMath already has 8000.
      - "${AI_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
